name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile assistant.py
      - name: Mock tests
        run: python -m unittest discover -s tests -v
      - name: Bash syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n install.sh
      - name: PowerShell syntax (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd\install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Linux installer smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TMP_HOME="$(mktemp -d)"
          export HOME="$TMP_HOME"
          unset QQBOT_STUDIO_HOME QQBOT_AI_ASSISTANT_HOME QQBOT_AI_ASSISTANT_CONFIG || true
          ./install.sh --port 18765 --host 0.0.0.0 --public-host assistant.example.com
          CONFIG="$HOME/.local/share/qqbot-studio/ai-assistant/config.json"
          test "$(stat -c '%a' "$CONFIG")" = "600"
          python - "$CONFIG" <<'PY'
          import json
          import sys
          config = json.load(open(sys.argv[1], encoding="utf-8"))
          assert config["host"] == "0.0.0.0"
          assert config["public_host"] == "assistant.example.com"
          assert config["port"] == 18765
          PY
          "$HOME/.local/bin/qqbot-ai-assistant" --version
          "$HOME/.local/bin/qqbot-ai-assistant" --diagnose > "$HOME/diagnose.json"
          python - "$HOME/diagnose.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["host"] == "0.0.0.0"
          assert report["port"] == 18765
          assert report["public_host"] == "assistant.example.com"
          assert "bind_test" in report and "health" in report and "host_guard" in report
          assert report["external_reachability"] == "not_verified"
          assert report["security_warnings"]
          assert '"api_key"' not in json.dumps(report)
          PY
          ./install.sh --uninstall --purge
          test ! -e "$HOME/.local/share/qqbot-studio/ai-assistant"
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $env:QQBOT_STUDIO_HOME = Join-Path $env:RUNNER_TEMP "qqbot-studio-home"
            $env:QQBOT_AI_ASSISTANT_HOME = Join-Path $env:QQBOT_STUDIO_HOME "ai-assistant"
            $env:QQBOT_AI_ASSISTANT_CONFIG = Join-Path $env:QQBOT_AI_ASSISTANT_HOME "config.json"
            .\install.ps1 -Port 18765 -BindHost 0.0.0.0 -PublicHost assistant.example.com
            if (-not (Test-Path -LiteralPath $env:QQBOT_AI_ASSISTANT_CONFIG)) { throw "install.ps1 did not create config.json" }
            $config = Get-Content -LiteralPath $env:QQBOT_AI_ASSISTANT_CONFIG -Raw | ConvertFrom-Json
            if ($config.port -ne 18765) { throw "unexpected port in config" }
            if ($config.host -ne "0.0.0.0") { throw "unexpected bind host in config" }
            if ($config.public_host -ne "assistant.example.com") { throw "unexpected public_host in config" }
            if ($config.key_source -ne "independent") { throw "unexpected key source" }
            $launcher = Join-Path $HOME ".local\bin\qqbot-ai-assistant.cmd"
            if (-not (Test-Path -LiteralPath $launcher)) { throw "install.ps1 did not create launcher" }
            & $launcher --version
            if ($LASTEXITCODE -ne 0) { throw "launcher --version failed with exit code $LASTEXITCODE" }
            $diagPath = Join-Path $env:RUNNER_TEMP "assistant-diagnose.json"
            & $launcher --diagnose | Out-File -LiteralPath $diagPath -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "launcher --diagnose failed with exit code $LASTEXITCODE" }
            $diag = Get-Content -LiteralPath $diagPath -Raw | ConvertFrom-Json
            if ($diag.host -ne "0.0.0.0") { throw "diagnose returned unexpected host" }
            if ($diag.port -ne 18765) { throw "diagnose returned unexpected port" }
            if ($diag.public_host -ne "assistant.example.com") { throw "diagnose returned unexpected public_host" }
            if ($diag.external_reachability -ne "not_verified") { throw "diagnose must not claim external reachability" }
            if ($diag.security_warnings.Count -lt 1) { throw "diagnose returned no security warnings" }
            if ((Get-Content -LiteralPath $diagPath -Raw) -match '"api_key"') { throw "diagnose output leaked api_key field" }
            .\install.ps1 -Uninstall
            .\install.ps1 -Uninstall -Purge
            if (Test-Path -LiteralPath $env:QQBOT_AI_ASSISTANT_HOME) { throw "purge left B data directory behind" }
          }
          catch {
            $detail = $_.Exception.Message + " || " + $_.ScriptStackTrace
            $detail = $detail -replace "`r?`n", " | "
            Write-Output "::error title=Windows installer smoke failure::$detail"
            throw
          }
