<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QQ Bot Studio · AI 助手 B</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#68738a;--line:#e2e7f1;--brand:#4568dc;--user:#eef2ff;--assistant:#f7f9fc;--ok:#16835b;--danger:#b42318;--shadow:0 16px 48px rgba(30,45,80,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#161f2e;--text:#eef3ff;--muted:#9ca9bf;--line:#29364a;--brand:#7f99ff;--user:#243456;--assistant:#1b2637;--ok:#64d4a7;--danger:#ff8b82;--shadow:0 18px 55px rgba(0,0,0,.32)}}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--text);background:radial-gradient(circle at 12% 8%,rgba(101,132,255,.16),transparent 30rem),radial-gradient(circle at 90% 90%,rgba(94,211,179,.12),transparent 28rem),var(--bg);font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:28px 0 22px;min-height:100vh;display:flex;flex-direction:column}header{display:flex;gap:14px;margin-bottom:18px}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:23px;background:linear-gradient(135deg,var(--brand),#93a9ff);box-shadow:0 8px 22px rgba(69,104,220,.3)}.titles{flex:1;min-width:0}h1{margin:1px 0 4px;font-size:clamp(21px,3vw,28px);line-height:1.2;letter-spacing:-.02em}.subtitle{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#d1922e}.badge.ready .dot{background:var(--ok)}.badge.error .dot{background:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:520px}.notice{display:none;padding:11px 18px;font-size:13px;line-height:1.55;color:#8b5b10;background:rgba(209,146,46,.1);border-bottom:1px solid var(--line)}.notice.show{display:block}.notice.error{color:var(--danger)}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;max-width:560px;padding:24px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px}.empty p{margin:0 0 8px;line-height:1.7;font-size:13px}.msg{display:flex;gap:10px;align-items:flex-start;max-width:88%}.msg.user{align-self:flex-end;flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--assistant);border:1px solid var(--line)}.msg.user .avatar{color:#fff;background:var(--brand);border-color:transparent}.bubble{padding:11px 14px;border-radius:14px;background:var(--assistant);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:14px}.msg.user .bubble{background:var(--user);border-color:transparent}.bubble.error-text{color:var(--danger)}.meta{color:var(--muted);font-size:11px;margin-top:5px}
.composer{border-top:1px solid var(--line);padding:14px 16px 12px}.input-wrap{display:flex;gap:10px;align-items:flex-end}textarea{width:100%;min-height:48px;max-height:180px;resize:vertical;padding:13px 14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:13px;font:inherit;line-height:1.5;outline:none}textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(69,104,220,.15)}button{border:0;border-radius:12px;cursor:pointer;font:inherit;font-weight:650}button:disabled{cursor:not-allowed;opacity:.55}#send{flex:0 0 auto;min-width:86px;height:48px;color:#fff;padding:0 18px;background:linear-gradient(135deg,var(--brand),#7f99ff)}.composer-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:8px}.hint{color:var(--muted);font-size:11px}.ghost{color:var(--muted);background:transparent;border:1px solid var(--line);padding:6px 10px;font-size:12px}footer{color:var(--muted);font-size:11px;text-align:center;margin-top:12px;line-height:1.6}
@media(max-width:620px){.shell{width:calc(100% - 16px);padding-top:16px}.mark{width:42px;height:42px}.card{border-radius:16px;min-height:560px}#chat{padding:14px}.msg{max-width:95%}.composer{padding:12px}#send{min-width:66px;padding:0 13px}.hint{display:none}}
</style>
</head>
<body>
<main class="shell">
<header><div class="mark" aria-hidden="true">B</div><div class="titles"><h1>QQ Bot Studio · AI 助手 B</h1><p class="subtitle">可选生成式 AI 使用助手 · 独立运行，不替代离线知识库助手 A</p><div id="status-badge" class="badge"><span class="dot"></span><span id="status-text">正在检查配置…</span></div></div></header>
<section class="card" aria-label="AI 对话">
<div id="notice" class="notice" role="status"></div>
<div id="chat" aria-live="polite"><div id="empty-state" class="empty"><strong>有什么可以帮你？</strong><p>消息仅在本次浏览器会话中保留。对话内容会发送到 DeepSeek 以生成回复。</p><p>使用前请在本机配置文件中设置 API Key；也可在明确配置后复用某个已部署实例的 Key。</p></div></div>
<div class="composer"><div class="input-wrap"><textarea id="message" rows="2" maxlength="12000" placeholder="输入消息…（Enter 发送，Shift + Enter 换行）" aria-label="消息"></textarea><button id="send" type="button">发送</button></div><div class="composer-foot"><span class="hint">固定模型 deepseek-flash · Key 不会显示在此页面</span><button id="clear" class="ghost" type="button">清空对话</button></div></div>
</section>
<footer>本地服务默认仅监听 127.0.0.1。请勿直接暴露到公网。</footer>
</main>
<script>
(()=>{"use strict";const chatEl=document.getElementById("chat"),emptyEl=document.getElementById("empty-state"),inputEl=document.getElementById("message"),sendEl=document.getElementById("send"),clearEl=document.getElementById("clear"),badgeEl=document.getElementById("status-badge"),statusTextEl=document.getElementById("status-text"),noticeEl=document.getElementById("notice");let history=[],sending=false;
function setNotice(text,isError=false){noticeEl.textContent=text||"";noticeEl.className="notice"+(text?" show":"")+(isError?" error":"")}
async function loadStatus(){try{const r=await fetch("/api/status",{headers:{Accept:"application/json"}}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"状态读取失败");if(d.configured){badgeEl.className="badge ready";statusTextEl.textContent="已就绪 · "+(d.key_source==="instance"?"复用实例 Key":"独立 Key")+" · "+d.model;setNotice("")}else{badgeEl.className="badge error";statusTextEl.textContent="尚未配置 API Key";setNotice(d.key_error||"尚未配置 API Key，请编辑本机配置文件后重启服务。",true)}}catch(e){badgeEl.className="badge error";statusTextEl.textContent="本地服务状态异常";setNotice("无法读取服务状态："+e.message,true)}}
function addMessage(role,text,isError=false){emptyEl.style.display="none";const wrap=document.createElement("div");wrap.className="msg "+role;const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"我":"B";const body=document.createElement("div");const bubble=document.createElement("div");bubble.className="bubble"+(isError?" error-text":"");bubble.textContent=text;const meta=document.createElement("div");meta.className="meta";meta.textContent=role==="user"?"你":"AI 助手 B";body.append(bubble,meta);wrap.append(avatar,body);chatEl.appendChild(wrap);chatEl.scrollTop=chatEl.scrollHeight}
function setSending(v){sending=v;sendEl.disabled=v;sendEl.textContent=v?"生成中…":"发送";inputEl.disabled=v}
async function send(){const message=inputEl.value.trim();if(!message||sending)return;setSending(true);setNotice("");addMessage("user",message);inputEl.value="";const requestHistory=history.slice(-20);try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({message,history:requestHistory})});let d={};try{d=await r.json()}catch(_){}if(!r.ok||!d.ok)throw new Error(d.error||("请求失败（HTTP "+r.status+"）"));addMessage("assistant",d.reply);history.push({role:"user",content:message},{role:"assistant",content:d.reply});if(history.length>20)history=history.slice(-20)}catch(e){addMessage("assistant",e.message||"请求失败，请稍后重试。",true);if(/API Key|鉴权/i.test(e.message||""))loadStatus()}finally{setSending(false);inputEl.focus()}}
sendEl.addEventListener("click",send);inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});clearEl.addEventListener("click",()=>{history=[];chatEl.querySelectorAll(".msg").forEach(n=>n.remove());emptyEl.style.display="";setNotice("");inputEl.focus()});loadStatus()})();
</script>
</body>
</html>
